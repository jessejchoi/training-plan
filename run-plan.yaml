      dates_html: Oct 12&ndash;18
      total_km_html: "~53km"
      template: Threshold + Aerobic Volume
      notes_html: Resume the established five-run rhythm. One quality session this week; keep the long run fully easy.
      days:
      - {type: rest, tags: [recovery], content_html: Rest}
      - type: thr
        tags: [threshold]
        label_html: 10 km &middot; 4 x 6 min
        pace_html: Threshold 4:48&ndash;5:03/km
