      - {type: rest, tags: [recovery], content_html: Rest}
      - {type: lng, tags: [long-run, steady], label_html: 19 km steady finish, pace_html: "Easy 6:15&ndash;7:00/km; steady 5:25&ndash;5:45/km", content_html: 15 km easy + final 25 min steady, stopping at 19 km}
      - {type: rec, tags: [easy, recovery], pace_html: "6:30&ndash;7:15/km, effort first", content_html: 7 km recovery, strength_html: Workout B &middot; light lower body}

    - week_html: '7'
      dates_html: Nov 23&ndash;29
      total_km_html: "~56km"
      template: Threshold + 3-Minute VO2
      notes_html: Two-quality week with the longest easy run of the block. Do not add a fast finish Saturday.
      days:
      - {type: rest, tags: [recovery], content_html: Rest}
      - type: thr
        tags: [threshold]
        label_html: 10 km &middot; 4 x 6 min
        pace_html: Threshold 4:48&ndash;5:03/km
        content_html: 10 km total &mdash; 2 km easy + 4 x (6 min threshold / 75&ndash;90 sec easy jog) + easy to 10 km
        strength_html: Workout A &middot; reduce lower-body volume 25%
      - {type: easy, tags: [easy], pace_html: "6:15&ndash;7:00/km, effort first", content_html: 9 km easy}
      - type: intv
        tags: [vo2max, 5k-specific]
        label_html: 10 km &middot; 6 x 3 min
        pace_html: 4:20&ndash;4:40/km
        content_html: 10 km total &mdash; 2 km easy + drills + 6 x (3 min VO2 effort / 2 min easy jog) + easy to 10 km
      - {type: rest, tags: [recovery], content_html: Rest}
      - {type: lng, tags: [long-run, easy], pace_html: "6:15&ndash;7:00/km, effort first", content_html: 20 km easy}
      - {type: rec, tags: [easy, recovery], pace_html: "6:30&ndash;7:15/km, effort first", content_html: 7 km recovery, strength_html: Workout B}

