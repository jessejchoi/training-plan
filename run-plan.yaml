      - {type: easy, tags: [easy, strides], label_html: 11 km + strides, pace_html: "Easy 6:15&ndash;7:00/km; strides relaxed-fast", content_html: 11 km easy + 6 x 20 sec relaxed strides with full easy recovery}
      - {type: rest, tags: [recovery], content_html: Rest}
      - {type: lng, tags: [long-run, steady], label_html: 19 km steady finish, pace_html: "Easy 6:15&ndash;7:00/km; steady 5:25&ndash;5:45/km", content_html: 14 km easy + 5 km steady}
      - {type: rec, tags: [easy, recovery], pace_html: "6:30&ndash;7:15/km, effort first", content_html: 7 km recovery, strength_html: Workout B &middot; light lower body}

