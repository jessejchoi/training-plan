      - {type: lng, tags: [long-run, easy], pace_html: "6:15&ndash;7:00/km, effort first", content_html: 16 km easy}
      - {type: rec, tags: [easy, recovery], pace_html: "6:30&ndash;7:15/km, effort first", content_html: 6 km recovery, strength_html: Workout B}

    - week_html: '9'
      dates_html: Dec 7&ndash;13
      total_km_html: "~54km"
      template: Threshold + 1K Repeats
      notes_html: Key two-quality week. Thursday is the first sustained session at current 5K effort.
      days:
      - {type: rest, tags: [recovery], content_html: Rest}
      - type: thr
        tags: [threshold]
        label_html: 10 km &middot; 3 x 8 min
        pace_html: Threshold 4:48&ndash;5:03/km
        content_html: 10 km total &mdash; 2 km easy + 3 x (8 min threshold / 90 sec easy jog) + easy to 10 km
        strength_html: Workout A &middot; reduce lower-body volume 25%
      - {type: easy, tags: [easy], pace_html: "6:15&ndash;7:00/km, effort first", content_html: 9 km easy}
      - type: intv
        tags: [vo2max, 5k-specific]
        label_html: 10 km &middot; 5 x 1 km
        pace_html: 4:32&ndash;4:47/km
        content_html: 10 km total &mdash; 2 km easy + drills + 5 x (1 km at current 5K effort / 2 min 30 sec easy jog) + easy to 10 km
