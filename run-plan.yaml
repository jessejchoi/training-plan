      notes_html: Cutback week before the most 5K-specific part of the block.
      days:
      - {type: rest, tags: [recovery], content_html: Rest}
      - type: thr
        tags: [threshold]
        label_html: 9 km &middot; 20 min
        pace_html: Threshold 4:48&ndash;5:03/km
        content_html: 9 km total &mdash; 2 km easy + 20 min continuous threshold + easy to 9 km
        strength_html: Workout A
      - {type: easy, tags: [easy], pace_html: "6:15&ndash;7:00/km, effort first", content_html: 8 km easy}
      - {type: easy, tags: [easy, strides], label_html: 10 km + strides, pace_html: "Easy 6:15&ndash;7:00/km; strides relaxed-fast", content_html: 10 km easy + 4 x 20 sec relaxed strides with full easy recovery}
