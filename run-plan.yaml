        pace_html: 4:20&ndash;4:40/km
        content_html: 10 km total &mdash; 2 km easy + drills + 7 x (600 m at 3K&ndash;5K effort / 90 sec easy jog) + easy to 10 km
      - {type: rest, tags: [recovery], content_html: Rest}
      - {type: lng, tags: [long-run, easy], pace_html: "6:15&ndash;7:00/km, effort first", content_html: 18 km easy}
      - {type: rec, tags: [easy, recovery], pace_html: "6:30&ndash;7:15/km, effort first", content_html: 7 km recovery, strength_html: Workout B}

    - week_html: '6'
